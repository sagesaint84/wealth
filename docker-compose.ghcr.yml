services:
  dashboard:
    image: ghcr.io/sagesaint84/wealth:latest
    container_name: wealth
    ports:
      - "127.0.0.1:4829:4829"
    volumes:
      - ./data:/app/data
      - ./toss-wts/bin/tossctl:/opt/toss-wts/tossctl:ro
      - ./toss-wts/config:/opt/toss-wts/config
    restart: unless-stopped
