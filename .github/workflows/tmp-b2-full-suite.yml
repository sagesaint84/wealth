name: Temporary Phase 10.5B2 baseline comparison

on:
  push:
    branches:
      - phase10-5b2-whatif-trading-expansion

permissions:
  contents: write

jobs:
  compare-baseline:
    runs-on: ubuntu-latest
    env:
      WEALTH_ENV: test
      WEALTH_TEST_SIGNING_SECRET: test-signing-secret
    steps:
      - name: Checkout B2 branch
        uses: actions/checkout@v4
        with:
          ref: phase10-5b2-whatif-trading-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare B2 test baseline
        run: mkdir -p data/users/sagesaint data/users/alice

      - name: Run five unrelated failures independently on B2
        continue-on-error: true
        run: |
          python -m unittest \
            tests.test_kftc_openbanking_balance.KftcOpenBankingBalanceTests.test_secure_files_fsync_before_replace_and_retry \
            tests.test_toss_wts_feed_confirmation_endpoint.TossWtsFeedConfirmationEndpointTests.test_unauthorized_user_does_not_stat_runtime_material \
            tests.test_toss_wts_feed_runtime.TossWtsFeedRuntimeTests.test_pre_confirm_check_returns_not_confirmed \
            tests.test_toss_wts_feed_runtime.TossWtsFeedRuntimeTests.test_static_auth_failure_blocks_confirm_without_material_inspection \
            tests.test_toss_wts_user_scope.UserScopeSecurityTests.test_user_a_cannot_cancel_user_b_attempt \
            -v

      - name: Run B2 focused regression set
        run: |
          python -m unittest \
            tests.test_financial_income_trading_what_if \
            tests.test_financial_income_trading_what_if_api \
            tests.test_financial_income_trading_what_if_static \
            tests.test_financial_income_what_if \
            tests.test_financial_income_what_if_api \
            tests.test_financial_income_what_if_static \
            tests.test_high_dividend_what_if \
            tests.test_high_dividend_what_if_static \
            tests.test_family_financial_income_risk \
            tests.test_family_financial_income_risk_api \
            tests.test_family_financial_income_risk_static \
            -v

      - name: Prepare main worktree
        run: |
          git fetch origin main
          git worktree add --detach /tmp/wealth-main origin/main
          mkdir -p /tmp/wealth-main/data/users/sagesaint /tmp/wealth-main/data/users/alice

      - name: Run same five tests independently on main
        continue-on-error: true
        working-directory: /tmp/wealth-main
        run: |
          python -m unittest \
            tests.test_kftc_openbanking_balance.KftcOpenBankingBalanceTests.test_secure_files_fsync_before_replace_and_retry \
            tests.test_toss_wts_feed_confirmation_endpoint.TossWtsFeedConfirmationEndpointTests.test_unauthorized_user_does_not_stat_runtime_material \
            tests.test_toss_wts_feed_runtime.TossWtsFeedRuntimeTests.test_pre_confirm_check_returns_not_confirmed \
            tests.test_toss_wts_feed_runtime.TossWtsFeedRuntimeTests.test_static_auth_failure_blocks_confirm_without_material_inspection \
            tests.test_toss_wts_user_scope.UserScopeSecurityTests.test_user_a_cannot_cancel_user_b_attempt \
            -v

      - name: Check B2 JavaScript and Python
        run: |
          node --check app/static/wealth-financial-income-what-if.js
          python -m py_compile app/services/tax/what_if.py app/main.py

      - name: Check B2 diff
        run: git diff --check origin/main...HEAD

      - name: Self-clean temporary workflow
        run: |
          git worktree remove --force /tmp/wealth-main || true
          rm -f .github/workflows/tmp-b2-full-suite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary baseline workflow'
          git push origin HEAD:phase10-5b2-whatif-trading-expansion
