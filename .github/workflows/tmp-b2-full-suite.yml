name: Temporary Phase 10.5B2 full suite

on:
  push:
    branches:
      - phase10-5b2-whatif-trading-expansion

permissions:
  contents: write

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase10-5b2-whatif-trading-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare existing test user directories
        run: mkdir -p data/users/sagesaint data/users/alice

      - name: Run full unittest suite
        env:
          WEALTH_ENV: test
          WEALTH_TEST_SIGNING_SECRET: test-signing-secret
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check B2 JavaScript
        run: node --check app/static/wealth-financial-income-what-if.js

      - name: Check Python compile
        run: python -m py_compile app/services/tax/what_if.py app/main.py

      - name: Check branch diff
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

      - name: Self-clean temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/tmp-b2-full-suite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary full-suite workflow'
          git push origin HEAD:phase10-5b2-whatif-trading-expansion
