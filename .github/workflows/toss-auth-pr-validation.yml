name: Toss WTS native Linux PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app/main.py'
      - 'app/services/toss_wts*.py'
      - 'app/services/system_settings.py'
      - 'app/static/wealth-settings*.js'
      - 'app/static/index.html'
      - 'vendor/tossctl-auth-helper/**'
      - 'ops/toss-auth/**'
      - 'ops/pension-ocr/**'
      - 'app/services/national_pension*.py'
      - 'app/services/ledger*.py'
      - 'app/static/wealth-ledger-ocr.*'
      - 'tests/test_national_pension*.py'
      - 'tests/test_pension_import*.py'
      - 'tests/test_pension_ocr_smoke.py'
      - 'tests/test_ledger_document*.py'
      - 'tests/test_toss_wts*.py'
      - 'tests/test_settings_frontend.py'
      - 'tests/test_settings_surface_chrome.py'
      - 'tests/test_kakao_settings_frontend.py'
      - 'tests/test_release_version.py'
      - 'tests/conftest.py'
      - '.github/workflows/toss-auth-pr-validation.yml'

permissions:
  contents: read

concurrency:
  group: toss-auth-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-validation:
    name: Toss auth native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
            python_arch: x64
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            python_arch: arm64
            platform: linux/arm64
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: tests
      PYTEST_ADDOPTS: ''
      EXPECTED_MACHINE: ${{ matrix.machine }}
      WEALTH_ENV: test
      WEALTH_DISABLE_ENV_FILE: '1'
      # No auth credentials, real sessions, browser debug output or artifact upload.

    steps:
      - name: Initialize synthetic runtime paths
        run: |
          printf 'WEALTH_DATA_DIR=%s/toss-auth-synthetic-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROCESS_TEST_REPORT=%s/toss-auth-process-tests.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SESSION_TEST_REPORT=%s/toss-session-model-tests.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SESSION_UI_REPORT=%s/toss-session-ui-tests.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LEDGER_TEST_REPORT=%s/ledger-safety-tests.xml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OCR_FIXTURE_DIR=%s/wealth-synthetic-ocr\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout PR merge revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up native Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Require native Linux architecture
        run: |
          python - <<'PY'
          import os
          import platform
          import sys
          if sys.platform != "linux" or sys.version_info[:2] != (3, 11):
              raise SystemExit("Linux Python 3.11 is required")
          if platform.machine() != os.environ["EXPECTED_MACHINE"]:
              raise SystemExit("Runner must use the requested native architecture")
          print(f"Native Linux/Python 3.11: {platform.machine()}")
          PY

      - name: Install regression-test dependencies
        run: |
          python -m pip install -r requirements.txt 'pytest>=9.0.3,<10' playwright websocket-client
          install -d -m 700 "$WEALTH_DATA_DIR"

      - name: Require ledger safety and user-confirmed manual import regressions
        run: |
          python -m playwright install chromium
          python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path).resolve(strict=True)
              browser = playwright.chromium.launch(executable_path=str(executable), headless=True, args=['--no-sandbox'])
              browser.close()
              print('CHROMIUM_STARTUP_CHECK=PASS')
          if not executable.is_file() or not os.access(executable, os.X_OK):
              raise SystemExit('Installed CI Chromium executable is unavailable')
          # The existing harness checks chrome first. Only this temporary CI
          # wrapper disables Chromium's sandbox for synthetic loopback tests.
          wrapper = Path(os.environ['RUNNER_TEMP']) / 'chrome'
          wrapper.write_text('#!/bin/sh\nexec ' + shlex.quote(str(executable))
                             + ' --no-sandbox "$@"\n', encoding='utf-8')
          wrapper.chmod(0o700)
          PY
          export PATH="$RUNNER_TEMP:$PATH"
          python -m pytest -q \
            tests/test_pension_ocr_smoke.py \
            tests/test_ledger_document_import.py \
            tests/test_ledger_document_save.py \
            tests/test_ledger_document_chrome.py \
            --tb=short --junitxml="$LEDGER_TEST_REPORT" \
            --basetemp="${RUNNER_TEMP}/ledger-safety-pytest"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['LEDGER_TEST_REPORT']).iter('testcase'))
          for module in ('test_pension_ocr_smoke', 'test_ledger_document_import',
                         'test_ledger_document_save', 'test_ledger_document_chrome'):
              selected = [case for case in cases if case.get('classname', '').endswith(module)]
              if not selected or any(case.find(tag) is not None for case in selected
                                     for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit('Required ledger regression missing, skipped or failed: ' + module)
          print('PASS: ledger safety, manual fallback and explicit confirmation regressions (no skips)')
          PY

      - name: Run mocked and real detached-child process tests
        run: |
          python -m pytest -q tests/test_toss_wts_auth_process.py \
            --tb=short --junitxml="$PROCESS_TEST_REPORT" \
            --basetemp="${RUNNER_TEMP}/toss-auth-pytest"

      - name: Require QR and extension real Linux integration tests without skipping
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          required = {
              "test_detached_descendants_are_reaped_after_cli_exit",
              "test_cancel_reaps_detached_descendants",
              "test_extend_restart_recovers_real_descendant_receipt",
              "test_extend_cancel_reaps_real_detached_descendants",
              "test_extend_deadline_reaps_real_detached_descendants",
          }
          cases = list(ET.parse(os.environ["PROCESS_TEST_REPORT"]).iter("testcase"))
          if not cases or any(case.find(tag) is not None for case in cases
                              for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Process boundary test missing, skipped or failed')
          for name in sorted(required):
              matches = [case for case in cases
                         if case.get("classname", "").endswith(".LinuxSyntheticProcessTests")
                         and case.get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(f"Required Linux integration test missing/duplicated: {name}")
              if any(matches[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
                  raise SystemExit(f"Required Linux integration test did not pass: {name}")
              print(f"PASS (executed, not skipped): LinuxSyntheticProcessTests::{name}")
          PY

      - name: Run Toss session API notification and explicit legacy model contracts
        run: |
          python -m pytest -q \
            tests/test_toss_wts_session.py tests/test_toss_wts_login.py \
            tests/test_toss_wts_auth_runtime.py tests/test_settings_frontend.py \
            tests/test_kakao_settings_frontend.py tests/test_release_version.py \
            --tb=short --junitxml="$SESSION_TEST_REPORT" \
            --basetemp="${RUNNER_TEMP}/toss-session-model-pytest"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['SESSION_TEST_REPORT']).iter('testcase'))
          for module in ('test_toss_wts_session', 'test_toss_wts_login', 'test_toss_wts_auth_runtime',
                         'test_settings_frontend', 'test_kakao_settings_frontend', 'test_release_version'):
              selected = [case for case in cases if module in case.get('classname', '').split('.')]
              if not selected or any(case.find(tag) is not None for case in selected
                                     for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit('Required model contract missing, skipped or failed: ' + module)
          for name in ('test_manual_api_requires_authenticated_owner_and_permission',
                       'test_manual_api_no_client_fields_no_retry_and_owner_scoped_result',
                       'test_http_cookie_auth_allowlist_and_untrusted_body_are_enforced'):
              selected = [case for case in cases if case.get('name') == name
                          and case.get('classname', '').endswith('.ManualExtensionApiTests')]
              if len(selected) != 1:
                  raise SystemExit('Manual API contract missing/duplicated: ' + name)
          for name in ('test_maintenance_only_extends_within_threshold_and_post_checks',
                       'test_post_extension_timestamp_uses_now_provider',
                       'test_extend_timeout_yields_auth_extend_timeout_code',
                       'test_extend_nonzero_exit_yields_auth_extend_failed_code',
                       'test_extend_oserror_yields_auth_extend_failed_code',
                       'test_extend_deferred_while_login_active',
                       'test_extend_deferred_when_advisory_lock_held',
                       'test_session_valid_without_reauth_raises',
                       'test_session_valid_with_reauth_proceeds',
                       'test_session_invalid_proceeds_without_reauth'):
              if not any(case.get('name') == name for case in cases):
                  raise SystemExit('Required model condition did not execute: ' + name)
          print('PASS: model/API contracts; legacy Windows mocks do not replace the separate native Linux gate')
          PY

      - name: Run existing Chromium settings contracts and Toss three-theme matrix
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python -m pytest -q tests/test_settings_surface_chrome.py \
            --tb=short --junitxml="$SESSION_UI_REPORT" \
            --basetemp="${RUNNER_TEMP}/toss-session-ui-pytest"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['SESSION_UI_REPORT']).iter('testcase'))
          if not cases or any(case.find(tag) is not None for case in cases
                              for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Chromium settings tests missing, skipped or failed')
          required = {'test_toss_extension_connection_loss_requires_get_not_post_retry',
                      'test_toss_qr_fresh_status_cancel_and_probe_failure_never_start_login'}
          required.update(f'test_toss_extension_progress_result_and_shared_button[{theme}-{width}]'
                          for theme in ('purple','white','oled') for width in (412,750,1280))
          for name in sorted(required):
              if sum(case.get('name') == name for case in cases) != 1:
                  raise SystemExit('Required Chromium condition missing/duplicated: ' + name)
          print('PASS: actual Chromium settings rendering/actions; no live Toss authentication')
          PY

      # No QEMU: each runner builds only its own native platform.
      - name: Generate public synthetic Korean OCR fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum
          python ops/pension-ocr/generate_fixtures.py \
            --font /usr/share/fonts/truetype/nanum/NanumGothic.ttf \
            --output "$OCR_FIXTURE_DIR"
          chmod 755 "$OCR_FIXTURE_DIR"
          chmod 644 "$OCR_FIXTURE_DIR/synthetic.png" "$OCR_FIXTURE_DIR/synthetic.pdf"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native image including network-disabled Chromium smoke
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          LOCAL_IMAGE_TAG: wealth-toss-auth-pr:${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "$BUILD_PLATFORM" \
            --file Dockerfile \
            --pull --no-cache --progress=plain \
            --tag "$LOCAL_IMAGE_TAG" \
            --load .

      - name: Run offline OCR smoke in the same native image
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          LOCAL_IMAGE_TAG: wealth-toss-auth-pr:${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          IMAGE_PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$LOCAL_IMAGE_TAG")"
          test "$IMAGE_PLATFORM" = "$BUILD_PLATFORM"
          docker run --rm \
            --platform "$BUILD_PLATFORM" \
            --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=$OCR_FIXTURE_DIR,dst=/fixtures,readonly" \
            --env WEALTH_ENV=test --env WEALTH_DISABLE_ENV_FILE=1 \
            --env WEALTH_DATA_DIR=/tmp/wealth-synthetic-data \
            --env DATA_DIR=/tmp/wealth-synthetic-data \
            --env PYTHONDONTWRITEBYTECODE=1 --env OMP_THREAD_LIMIT=1 \
            --entrypoint python \
            "$LOCAL_IMAGE_TAG" /app/ops/pension-ocr/smoke.py \
            --expected-machine "$EXPECTED_MACHINE"

      - name: Remove transient synthetic test report
        if: always()
        run: rm -f -- "$PROCESS_TEST_REPORT" "$SESSION_TEST_REPORT" "$SESSION_UI_REPORT" "$LEDGER_TEST_REPORT"
