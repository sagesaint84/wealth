name: Build and Publish Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read application version
        id: app_version
        shell: bash
        env:
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: |
          read_version() {
            sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
          }

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version="$(read_version < app/main.py)"
          [[ "$version" =~ $semver ]]

          publish_version=false
          # Compare with main before the push, including multi-commit merges.
          if [[ "$PREVIOUS_MAIN" =~ ^[0-9a-f]{40}$ ]] &&
             previous="$(git show "$PREVIOUS_MAIN:app/main.py" 2>/dev/null | read_version)" &&
             [[ "$previous" =~ $semver ]]; then
            highest="$(printf '%s\n' "$previous" "$version" | LC_ALL=C sort -V | tail -n 1)"
            if [[ "$version" != "$previous" && "$version" == "$highest" ]]; then
              publish_version=true
            fi
          else
            echo "::warning::Cannot establish the previous main version; skipping the version tag."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_version=$publish_version" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=raw,value=${{ steps.app_version.outputs.version }},enable=${{ steps.app_version.outputs.publish_version }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
