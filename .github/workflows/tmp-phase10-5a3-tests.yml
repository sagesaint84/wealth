name: Temporary Phase 10.5A3 tests

on:
  push:
    branches:
      - phase10-5a3-what-if-simulator

permissions:
  contents: write

env:
  WEALTH_ENV: test
  WEALTH_DISABLE_ENV_FILE: "1"
  WEALTH_TEST_SIGNING_SECRET: phase10-5a3-test-signing-secret

jobs:
  test-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a3-what-if-simulator
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check What-if JavaScript syntax
        run: node --check app/static/wealth-financial-income-what-if.js

      - name: Run Phase 10.5A3 tests
        run: |
          python -m unittest \
            tests.test_financial_income_what_if \
            tests.test_financial_income_what_if_api \
            tests.test_financial_income_what_if_static \
            -v

      - name: Run Phase 10.5 regression tests
        run: |
          python -m unittest \
            tests.test_financial_income_projection \
            tests.test_financial_income_projection_guards \
            tests.test_financial_income_projection_api \
            tests.test_investment_tax_comparison \
            tests.test_investment_tax_comparison_guards \
            tests.test_financial_income_what_if \
            tests.test_financial_income_what_if_api \
            tests.test_financial_income_what_if_static \
            -v

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-phase10-5a3-tests.yml
          git config user.name "wealth-phase-builder"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/tmp-phase10-5a3-tests.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary phase10.5a3 test workflow"
            git push origin HEAD:phase10-5a3-what-if-simulator
          fi
