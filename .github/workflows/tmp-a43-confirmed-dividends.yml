name: Temporary Phase 10.5A4.3 checks

on:
  push:
    branches:
      - phase10-5a43-confirmed-dividend-disclosures

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    env:
      WEALTH_ENV: test
      WEALTH_TEST_SIGNING_SECRET: a43-temporary-test-signing-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a43-confirmed-dividend-disclosures
          fetch-depth: 0

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Phase 10.5A4.3 patch
        run: python .github/patch_a43_confirmed_dividends.py

      - name: Run focused tests
        run: |
          python -m unittest \
            tests.test_dividend_confirmed_disclosures \
            tests.test_dividend_official_sources \
            tests.test_dividend_official_source_static \
            tests.test_dividend_official_user_scope \
            tests.test_dart_user_openapi \
            tests.test_financial_income_projection \
            tests.test_financial_income_projection_guards \
            -v

      - name: Check JavaScript
        run: node --check app/static/wealth-dividend-source.js

      - name: Compile changed Python
        run: python -m py_compile app/services/dividend_confirmed_disclosures.py app/services/dividend_official_sources.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified implementation and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/patch_a43_confirmed_dividends.py .github/workflows/tmp-a43-confirmed-dividends.yml
          git add -A
          git commit -m "feat: structure confirmed dividend disclosures"
          git push origin HEAD:phase10-5a43-confirmed-dividend-disclosures
