name: Temporary Phase 10.5A3 watch state

on:
  push:
    branches:
      - phase10-5a3-what-if-simulator

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a3-what-if-simulator
          fetch-depth: 0

      - name: Use server watch state in What-if UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/static/wealth-financial-income-what-if.js")
          text = path.read_text(encoding="utf-8")
          old = '''    const threshold = whatIf?.thresholds?.comprehensive_tax || {};\n    const scenarioState = threshold?.scenario || {};\n    const projected = whatIf.scenario_projected_gross_screening_income_krw;\n'''
          new = '''    const threshold = whatIf?.thresholds?.comprehensive_tax || {};\n    const scenarioState = threshold?.scenario || {};\n    const watchState = whatIf?.thresholds?.watch?.scenario || {};\n    const projected = whatIf.scenario_projected_gross_screening_income_krw;\n'''
          if old not in text:
              raise SystemExit("threshold state marker not found")
          text = text.replace(old, new, 1)

          old = '''    } else if (projected !== null && Number(projected) >= 10_000_000) {\n      statusClass = 'warn';\n      statusText = '주의 구간';\n'''
          new = '''    } else if (watchState.at_or_above === true) {\n      statusClass = 'warn';\n      statusText = '주의 구간';\n'''
          if old not in text:
              raise SystemExit("hardcoded watch threshold marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-phase10-5a3-watch-state.yml
          git config user.name "wealth-phase-builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/static/wealth-financial-income-what-if.js .github/workflows/tmp-phase10-5a3-watch-state.yml
          git diff --cached --check
          git commit -m "refactor: use server financial income watch state"
          git push origin HEAD:phase10-5a3-what-if-simulator
