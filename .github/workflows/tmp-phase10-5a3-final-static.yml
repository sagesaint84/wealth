name: Temporary Phase 10.5A3 final static check

on:
  push:
    branches:
      - phase10-5a3-what-if-simulator

permissions:
  contents: write

env:
  WEALTH_ENV: test
  WEALTH_DISABLE_ENV_FILE: "1"
  WEALTH_TEST_SIGNING_SECRET: phase10-5a3-final-static-secret

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a3-what-if-simulator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: node --check app/static/wealth-financial-income-what-if.js
      - name: Run What-if static tests
        run: python -m unittest tests.test_financial_income_what_if_static -v
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-phase10-5a3-final-static.yml
          git config user.name "wealth-phase-builder"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/tmp-phase10-5a3-final-static.yml
          git commit -m "chore: remove temporary phase10.5a3 final static workflow"
          git push origin HEAD:phase10-5a3-what-if-simulator
