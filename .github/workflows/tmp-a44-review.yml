name: Temporary Phase 10.5A4.4 review checks

on:
  push:
    branches:
      - phase10-5a44-domestic-etf-official-source

permissions:
  contents: write

env:
  WEALTH_ENV: test
  WEALTH_TEST_SIGNING_SECRET: a44-review-test-signing-secret

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a44-domestic-etf-official-source
          fetch-depth: 0

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply review fixes
        run: python .github/patch_a44_review.py

      - name: Run focused tests
        run: |
          python -m unittest \
            tests.test_kind_etf_distributions \
            tests.test_dividend_confirmed_disclosures \
            tests.test_dividend_official_sources \
            tests.test_dividend_official_source_static \
            tests.test_dividend_official_user_scope \
            tests.test_financial_income_projection \
            tests.test_financial_income_projection_guards \
            -v

      - name: Check JavaScript
        run: node --check app/static/wealth-dividend-source.js

      - name: Compile changed Python
        run: |
          python -m py_compile \
            app/services/etf_kind_distributions.py \
            app/services/dividend_official_sources.py \
            app/services/web_finance.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified review fixes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/patch_a44_review.py .github/workflows/tmp-a44-review.yml
          git add -A
          git commit -m "fix: harden KIND ETF official overlay"
          git push origin HEAD:phase10-5a44-domestic-etf-official-source
