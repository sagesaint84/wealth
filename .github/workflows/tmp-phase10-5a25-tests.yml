name: Temporary Phase 10.5A2.5 tests

on:
  push:
    branches:
      - phase10-5a25-family-corp-tax-comparison

permissions:
  contents: write

jobs:
  test-and-cleanup:
    runs-on: ubuntu-latest
    env:
      WEALTH_ENV: test
      WEALTH_DISABLE_ENV_FILE: "1"
      WEALTH_TEST_SIGNING_SECRET: phase10-5a25-test-signing-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a25-family-corp-tax-comparison
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run investment tax comparison tests
        run: |
          python -m unittest \
            tests.test_investment_tax_comparison \
            tests.test_investment_tax_comparison_guards \
            -v

      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/tmp-phase10-5a25-tests.yml
          git config user.name "wealth-phase-builder"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/tmp-phase10-5a25-tests.yml
          git commit -m "chore: remove temporary phase10.5a2.5 test workflow"
          git push origin HEAD:phase10-5a25-family-corp-tax-comparison
