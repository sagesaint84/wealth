name: Temporary Phase 10.5A4.1 dividend source UI checks

on:
  push:
    branches:
      - phase10-5a41-official-dividend-forecast
    paths:
      - .github/workflows/tmp-phase10-5a41-ui.yml

permissions:
  contents: write

jobs:
  patch-verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a41-official-dividend-forecast
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire source UI
        run: python scripts/tmp_patch_phase10_5a41_ui.py
      - name: Install targeted dependency
        run: python -m pip install --quiet httpx
      - name: Run official source tests
        run: |
          python -m unittest tests.test_dividend_official_sources tests.test_dividend_official_source_static -v
      - name: Check JavaScript syntax
        run: node --check app/static/wealth-dividend-source.js
      - name: Compile services
        run: python -m py_compile app/services/dividend_official_sources.py app/services/web_finance.py
      - name: Commit UI wiring and remove temporary helpers
        if: always()
        run: |
          git config user.name wealth-phase-builder
          git config user.email actions@users.noreply.github.com
          git add app/static/index.html
          git rm .github/workflows/tmp-phase10-5a41-ui.yml scripts/tmp_patch_phase10_5a41_ui.py
          git commit -m "feat: show dividend forecast source status" || true
          git push origin HEAD:phase10-5a41-official-dividend-forecast
