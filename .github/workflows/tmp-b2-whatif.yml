name: Temporary Phase 10.5B2 checks

on:
  push:
    branches:
      - phase10-5b2-whatif-trading-expansion

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase10-5b2-whatif-trading-expansion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Phase 10.5B2 integration
        run: python scripts/tmp_b2_apply.py

      - name: Run focused tests
        env:
          WEALTH_ENV: test
          WEALTH_TEST_SIGNING_SECRET: test-signing-secret
        run: |
          python -m unittest \
            tests.test_financial_income_trading_what_if \
            tests.test_financial_income_trading_what_if_api \
            tests.test_financial_income_trading_what_if_static \
            tests.test_financial_income_what_if \
            tests.test_financial_income_what_if_api \
            tests.test_financial_income_what_if_static \
            tests.test_high_dividend_what_if \
            tests.test_high_dividend_what_if_static \
            tests.test_family_financial_income_risk \
            tests.test_family_financial_income_risk_api \
            tests.test_family_financial_income_risk_static \
            -v

      - name: Check JavaScript
        run: node --check app/static/wealth-financial-income-what-if.js

      - name: Compile changed Python
        run: |
          python -m py_compile app/services/tax/what_if.py app/main.py

      - name: Check docs state
        run: |
          grep -q 'Phase 10.5B-2' docs/PROJECT_STATE.md
          grep -q 'PR #26 merge (`a8883c2`)' docs/PROJECT_STATE.md
          grep -q 'Phase 10.5B-3' docs/ROADMAP.md

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified implementation and self-clean
        run: |
          rm -f scripts/tmp_b2_apply.py
          rm -f .github/workflows/tmp-b2-whatif.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expand financial income trading what-if'
          git push origin HEAD:phase10-5b2-whatif-trading-expansion
