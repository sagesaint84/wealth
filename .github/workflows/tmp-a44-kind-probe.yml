name: Temporary Phase 10.5A4.4 KIND probe

on:
  push:
    branches:
      - phase10-5a44-domestic-etf-official-source

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe KIND viewer contract
        shell: bash
        run: |
          python - <<'PY'
          from http.cookiejar import CookieJar
          from urllib.request import Request, build_opener, HTTPCookieProcessor
          import re

          BASE='https://kind.krx.co.kr'
          MAIN='/disclosure/disclosurebystocktype.do?method=searchDisclosureByStockTypeEtf'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36'
          opener=build_opener(HTTPCookieProcessor(CookieJar()))
          req=Request(BASE+MAIN, headers={'User-Agent':UA,'Accept-Language':'ko-KR,ko;q=0.9'})
          with opener.open(req, timeout=15) as r:
              raw=r.read(); enc=r.headers.get_content_charset() or 'utf-8'
              try: html=raw.decode(enc)
              except UnicodeDecodeError: html=raw.decode('euc-kr','replace')
          for needle in ['function openDisclsViewer','openDisclsViewer =','openDisclsViewer(','disclsviewer','viewer.do','acptno','acptNo']:
              print('\nNEEDLE',needle,'count=',html.lower().count(needle.lower()))
              for m in list(re.finditer(re.escape(needle),html,re.I))[:8]:
                  lo=max(0,m.start()-700); hi=min(len(html),m.end()+1600)
                  print(re.sub(r'\s+',' ',html[lo:hi])[:2400])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('\nSCRIPTS', scripts)
          for src in scripts:
              if src.startswith('//'): url='https:'+src
              elif src.startswith('http'): url=src
              elif src.startswith('/'): url=BASE+src
              else: url=BASE+'/'+src
              try:
                  rq=Request(url, headers={'User-Agent':UA,'Referer':BASE+MAIN})
                  with opener.open(rq,timeout=15) as rr:
                      b=rr.read(); e=rr.headers.get_content_charset() or 'utf-8'
                      try: text=b.decode(e)
                      except UnicodeDecodeError: text=b.decode('euc-kr','replace')
                  if 'openDisclsViewer' in text:
                      print('\nFOUND_IN_SCRIPT',url)
                      for m in list(re.finditer('openDisclsViewer',text,re.I))[:6]:
                          lo=max(0,m.start()-600); hi=min(len(text),m.end()+1400)
                          print(re.sub(r'\s+',' ',text[lo:hi])[:2200])
              except Exception as exc:
                  print('SCRIPT_ERROR',url,type(exc).__name__)
          PY
