name: Temporary Phase 10.5B1 checks

on:
  push:
    branches:
      - phase10-5b1-family-financial-income-risk

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      WEALTH_ENV: test
      WEALTH_TEST_SIGNING_SECRET: b1-temporary-test-signing-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase10-5b1-family-financial-income-risk
          fetch-depth: 0

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Phase 10.5B1 integration
        run: python .github/apply_b1_family_risk.py

      - name: Run focused tests
        run: |
          python -m unittest \
            tests.test_family_financial_income_risk \
            tests.test_family_financial_income_risk_api \
            tests.test_family_financial_income_risk_static \
            tests.test_financial_income_projection \
            tests.test_financial_income_projection_guards \
            tests.test_financial_income_what_if \
            tests.test_financial_income_what_if_api \
            -v

      - name: Check JavaScript
        run: node --check app/static/wealth-family-financial-income-risk.js

      - name: Compile changed Python
        run: |
          python -m py_compile \
            app/services/tax/family_financial_income.py \
            app/services/tax/__init__.py \
            app/main.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified implementation and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_b1_family_risk.py .github/workflows/tmp-b1-family-risk.yml
          git add -A
          git commit -m "feat: add family financial income risk view"
          git push origin HEAD:phase10-5b1-family-financial-income-risk
