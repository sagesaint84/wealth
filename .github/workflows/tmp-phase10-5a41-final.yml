name: Temporary Phase 10.5A4.1 final checks

on:
  push:
    branches:
      - phase10-5a41-official-dividend-forecast
    paths:
      - .github/workflows/tmp-phase10-5a41-final.yml

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-5a41-official-dividend-forecast
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependency
        run: python -m pip install --quiet httpx
      - name: Run A4.1 tests
        run: python -m unittest tests.test_dividend_official_sources tests.test_dividend_official_source_static -v
      - name: Check JavaScript syntax
        run: node --check app/static/wealth-dividend-source.js
      - name: Compile changed services
        run: python -m py_compile app/services/dividend_official_sources.py app/services/web_finance.py
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name wealth-phase-builder
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/tmp-phase10-5a41-final.yml
          git commit -m "chore: remove temporary official dividend final check" || true
          git push origin HEAD:phase10-5a41-official-dividend-forecast
